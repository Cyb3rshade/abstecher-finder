name: Daten bauen und veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'      # jeden Montag 03:00 UTC frische OSM-Daten
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Geofabrik-Pfade unter europe/ – hier Länder ergänzen oder entfernen
  COUNTRIES: germany austria switzerland france netherlands belgium luxembourg denmark poland czech-republic

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Einmalig: hochgeladene projekt.zip entpacken und als normale Dateien ins Repo übernehmen
      - name: Projekt-ZIP entpacken
        if: hashFiles('projekt.zip') != ''
        run: |
          unzip -o -q projekt.zip
          git rm -q projekt.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Projekt entpackt"
          git push

      - name: Kalenderwoche bestimmen
        id: week
        run: echo "kw=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      # Der gefilterte Auszug wird pro Woche gecacht: Pushes am Code laden nicht jedes Mal 4 GB.
      - name: Gefilterte OSM-Daten aus Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: filtered.osm.pbf
          key: osm-${{ steps.week.outputs.kw }}-${{ hashFiles('web/categories.json') }}-${{ hashFiles('.github/workflows/build.yml') }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Werkzeuge installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          pip install osmium

      - name: Platz auf dem Server schaffen
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      # Jedes Land einzeln laden und sofort filtern, damit nie mehr als ein großer Auszug auf der Platte liegt
      - name: Länder laden, filtern und zusammenführen
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          FILTER=$(python3 scripts/build_pois.py --filter web/categories.json)
          for c in $COUNTRIES; do
            echo "::group::$c"
            curl -fsSL -o in.osm.pbf "https://download.geofabrik.de/europe/$c-latest.osm.pbf"
            osmium tags-filter in.osm.pbf $FILTER -o "part-$c.osm.pbf" --overwrite
            rm in.osm.pbf
            ls -lh "part-$c.osm.pbf"
            echo "::endgroup::"
          done
          osmium merge part-*.osm.pbf -o filtered.osm.pbf --overwrite
          rm part-*.osm.pbf
          ls -lh filtered.osm.pbf

      - name: Kacheln bauen
        run: python3 scripts/build_pois.py web/categories.json filtered.osm.pbf web/data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
