<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sidequest – Ausflugsziele entlang deiner Route</title>
<meta name="description" content="Sidequest by Cybershade: Freizeitparks, Spaßbäder, Zoos und mehr entlang deiner Route finden.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Sidequest by Cybershade">
<meta property="og:title" content="Sidequest – Ausflugsziele entlang deiner Route">
<meta property="og:description" content="Gib Start und Ziel ein und finde Freizeitparks, Spaßbäder, Zoos, Burgen und mehr, die unterwegs nur einen kleinen Umweg entfernt sind.">
<meta name="theme-color" content="#F4F4F4" id="themeColor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Sidequest">
<meta name="application-name" content="Sidequest">
<link rel="preload" href="fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
<script>
  // Theme vor dem ersten Zeichnen setzen, damit nichts aufblitzt
  (function(){ try{ var s = JSON.parse(localStorage.getItem('af-settings')) || {}; var t = s.theme || 'auto';
    if(t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t; }catch(e){ document.documentElement.dataset.theme = 'light'; } })();
</script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button type="button" class="route-pill" id="routeBtn" aria-haspopup="dialog">
      <span class="route-text">
        <strong id="routeTitle">Route planen</strong>
        <small id="routeSub">Start und Ziel eingeben</small>
      </span>
      <span class="pill-icon" data-icon="edit" aria-hidden="true"></span>
    </button>
    <div class="top-actions">
      <button type="button" class="icon-btn" id="shareBtn" aria-label="Route teilen" data-icon="share" disabled></button>
      <button type="button" class="icon-btn" id="settingsBtn" aria-label="Einstellungen" data-icon="gear"></button>
    </div>
    <div class="progress" id="progress" hidden><span></span></div>
  </header>

  <main class="map-area">
    <div id="map"></div>
    <button type="button" class="dice" id="diceBtn" aria-label="Überrasch mich: zufälliges Ziel zeigen"><span data-icon="dice" aria-hidden="true"></span><span class="dice-label">Überrasch mich</span></button>
  </main>

  <aside class="panel" id="panel" aria-label="Sidequests">
    <div class="panel-drag" id="panelDrag">
      <button type="button" class="grip" id="grip" aria-label="Liste größer oder kleiner"></button>
      <div class="panel-head">
        <div class="panel-title">
          <h2 id="listTitle">Sidequests</h2>
          <p id="listSub">Plane zuerst eine Route</p>
        </div>
        <div class="panel-tools">
          <button type="button" class="tool-btn" id="favToggle" aria-pressed="false" aria-label="Nur gemerkte Ziele zeigen"><span data-icon="star" aria-hidden="true"></span><span id="favCount"></span></button>
          <button type="button" class="filter-btn" id="filterBtn" aria-haspopup="dialog"><span data-icon="filter" aria-hidden="true"></span>Filter<span class="badge" id="filterBadge" hidden></span></button>
        </div>
      </div>
    </div>
    <div class="quick-cats" id="quickCats" aria-label="Kategorien"></div>
    <div class="panel-body" id="list"></div>
    <div class="tourbar" id="tourbar" hidden></div>
  </aside>
</div>

<div class="scrim" id="scrim" hidden></div>

<section class="sheet" id="routeSheet" role="dialog" aria-modal="true" aria-labelledby="routeSheetTitle" hidden>
  <div class="sheet-head"><h2 id="routeSheetTitle">Route planen</h2><button type="button" class="icon-btn flat" data-close aria-label="Schließen" data-icon="x"></button></div>
  <form class="sheet-body" id="routeForm" autocomplete="off">
    <ol class="stops" id="stops"></ol>
    <button type="button" class="text-btn" id="addStop">+ Zwischenstopp</button>
    <label class="field">So weit dürfen Sidequests von der Route entfernt sein
      <span class="slider"><input type="range" id="radius" min="2" max="25" value="8"><output id="radiusOut">8 km</output></span>
    </label>
    <p class="status" id="routeStatus" role="status"></p>
    <button type="submit" class="primary-btn" id="goBtn">Route suchen</button>
  </form>
  <datalist id="places"></datalist>
</section>

<section class="sheet" id="filterSheet" role="dialog" aria-modal="true" aria-labelledby="filterSheetTitle" hidden>
  <div class="sheet-head"><h2 id="filterSheetTitle">Filter</h2><div class="head-actions"><button type="button" class="text-btn" id="resetFilters">Zurücksetzen</button><button type="button" class="icon-btn flat" data-close aria-label="Filter schließen" data-icon="x"></button></div></div>
  <div class="sheet-body" id="filterBody"></div>
  <div class="sheet-foot"><button type="button" class="primary-btn" id="applyFilters" data-close>Ziele anzeigen</button></div>
</section>

<section class="sheet detail" id="detailSheet" role="dialog" aria-modal="true" aria-labelledby="detailTitle" hidden>
  <button type="button" class="icon-btn hero-close" data-close aria-label="Schließen" data-icon="x"></button>
  <div id="detailBody"></div>
</section>

<section class="sheet" id="tourSheet" role="dialog" aria-modal="true" aria-labelledby="tourSheetTitle" hidden>
  <div class="sheet-head"><h2 id="tourSheetTitle">Deine Tour</h2><button type="button" class="icon-btn flat" data-close aria-label="Schließen" data-icon="x"></button></div>
  <div class="sheet-body" id="tourBody"></div>
  <div class="sheet-foot" id="tourFoot"></div>
</section>

<section class="sheet" id="settingsSheet" role="dialog" aria-modal="true" aria-labelledby="settingsSheetTitle" hidden>
  <div class="sheet-head"><h2 id="settingsSheetTitle">Einstellungen</h2><button type="button" class="icon-btn flat" data-close aria-label="Schließen" data-icon="x"></button></div>
  <div class="sheet-body" id="settingsBody"></div>
</section>

<section class="sheet" id="installSheet" role="dialog" aria-modal="true" aria-labelledby="installSheetTitle" hidden>
  <div class="sheet-head"><h2 id="installSheetTitle">Als App installieren</h2><button type="button" class="icon-btn flat" data-close aria-label="Schließen" data-icon="x"></button></div>
  <div class="sheet-body" id="installBody"></div>
</section>

<div id="toast" role="status" hidden></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
