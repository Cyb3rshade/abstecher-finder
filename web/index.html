<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abstecher-Finder</title>
<meta name="description" content="Freizeitparks, Spaßbäder, Zoos und mehr entlang deiner Route finden.">
<meta name="theme-color" content="#1D4F91">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <section class="controls">
    <header class="sign">
      <div>
        <h1>Abstecher-Finder</h1>
        <p id="databadge">Daten werden geladen …</p>
      </div>
      <button type="button" class="share" id="share" disabled>Teilen</button>
    </header>

    <form id="f" autocomplete="off">
      <ol id="stops" class="stops"></ol>
      <button type="button" class="link" id="addstop">+ Zwischenstopp</button>
      <label class="f">Suchkorridor um die Route
        <span class="slider"><input type="range" id="radius" min="2" max="25" value="8"><output id="rv">8 km</output></span>
      </label>
      <button class="go" id="go" type="submit">Route suchen</button>
    </form>
    <datalist id="places"></datalist>
    <div id="status" role="status"></div>

    <div class="step">
      <h2>Kategorie <small>mehrere möglich</small></h2>
      <div class="chips" id="mains"></div>
    </div>
    <div class="step" id="subwrap">
      <h2>Genauer <small>leer lassen = alles aus der Kategorie</small></h2>
      <div id="subs"></div>
    </div>
    <div class="step">
      <h2>Extras <small>alle gewählten müssen passen</small></h2>
      <div class="chips" id="extras"></div>
    </div>

    <details class="box">
      <summary>Mehr Optionen</summary>
      <div class="box-body">
        <label class="f">Stichwort im Namen<input type="search" id="kw" placeholder="z. B. Schwarzlicht, Piraten, Burg …"></label>
        <label class="f">Maximaler Umweg (Luftlinie zur Route)
          <span class="slider"><input type="range" id="maxoff" min="0.5" max="8" step="0.5" value="8"><output id="mv">8 km</output></span>
        </label>
        <label class="chk"><input type="checkbox" id="named" checked> Nur Orte mit Namen</label>
        <button type="button" class="link" id="reset">Filter zurücksetzen</button>
      </div>
    </details>
  </section>

  <div id="map"></div>

  <section class="list-wrap">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="hits" aria-selected="true">Treffer <span id="nhits"></span></button>
      <button type="button" role="tab" data-tab="favs" aria-selected="false">Merkliste <span id="nfavs"></span></button>
    </div>
    <ol id="list"></ol>
  </section>
</div>
<div id="toast" role="status" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>
</body>
</html>
