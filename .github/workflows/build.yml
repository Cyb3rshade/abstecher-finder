name: Daten bauen und veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'      # jeden Montag 03:00 UTC frische OSM-Daten
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Geofabrik-Pfade unter europe/ – hier Länder ergänzen oder entfernen
  COUNTRIES: germany austria switzerland france netherlands belgium luxembourg denmark poland czech-republic

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Sicherheitscheck – keine Keys oder Tokens im Repo
        run: |
          if grep -rEn "sk-ant-[A-Za-z0-9_-]{10,}|github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{30,}|ST1\\.[A-Za-z0-9_-]{60,}" --exclude-dir=.git .; then
            echo "::error::Möglicher API-Key, GitHub-Token oder Verbindungscode gefunden. Deploy abgebrochen – aus dem Repo entfernen und den Key/Token sperren."
            exit 1
          fi

      - name: Dateien prüfen
        run: |
          node -e "JSON.parse(require('fs').readFileSync('web/manifest.webmanifest','utf8'))"
          node -e "const c=JSON.parse(require('fs').readFileSync('web/categories.json','utf8'));if(!c.main||!c.main.length)process.exit(1);const ids=new Set();for(const m of c.main){if(!m.id||!m.label||!m.subs||!m.subs.length){console.error('Oberkategorie unvollständig: '+m.id);process.exit(1)}for(const s of m.subs){if(!s.id||ids.has(s.id)){console.error('Doppelte oder fehlende Unterkategorie-ID: '+s.id);process.exit(1)}ids.add(s.id)}}console.log(c.main.length+' Oberkategorien, '+ids.size+' Unterkategorien')"
          node --check web/app.js
          node --check web/sw.js
          node -e "const fs=require('fs');const h=fs.readFileSync('web/index.html','utf8');const m=[...h.matchAll(/<script(?![^>]*src)[^>]*>([\\s\\S]*?)<\\/script>/g)].map(x=>x[1]).join('\\n');fs.writeFileSync('/tmp/inline.js',m)"
          node --check /tmp/inline.js
          python3 -m py_compile scripts/build_pois.py
          if grep -rEn "fonts\\.googleapis|fonts\\.gstatic|cdnjs\\.cloudflare|unpkg\\.com|cdn\\.jsdelivr" web --include=*.html --include=*.css --include=*.js; then
            echo "::error::Externe Schrift- oder Bibliotheks-Adresse gefunden. Dateien gehören ins Repo (siehe ARCHITEKTUR.md, Abschnitt Rechtliches)."
            exit 1
          fi

      - name: Kalenderwoche bestimmen
        id: week
        run: echo "kw=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      # Der gefilterte Auszug wird pro Woche gecacht: Pushes am Code laden nicht jedes Mal 4 GB.
      - name: Gefilterte OSM-Daten aus Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: filtered.osm.pbf
          key: osm-${{ steps.week.outputs.kw }}-${{ hashFiles('web/categories.json') }}-${{ hashFiles('.github/workflows/build.yml') }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Werkzeuge installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          pip install osmium

      - name: Platz auf dem Server schaffen
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      # Jedes Land einzeln laden und sofort filtern, damit nie mehr als ein großer Auszug auf der Platte liegt
      - name: Länder laden, filtern und zusammenführen
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          FILTER=$(python3 scripts/build_pois.py --filter web/categories.json)
          for c in $COUNTRIES; do
            echo "::group::$c"
            curl -fsSL -o in.osm.pbf "https://download.geofabrik.de/europe/$c-latest.osm.pbf"
            osmium tags-filter in.osm.pbf $FILTER -o "part-$c.osm.pbf" --overwrite
            rm in.osm.pbf
            ls -lh "part-$c.osm.pbf"
            echo "::endgroup::"
          done
          osmium merge part-*.osm.pbf -o filtered.osm.pbf --overwrite
          rm part-*.osm.pbf
          ls -lh filtered.osm.pbf

      - name: Kacheln bauen
        run: python3 scripts/build_pois.py web/categories.json filtered.osm.pbf web/data

      - name: App zusammenstellen und Version stempeln
        run: |
          VERSION="$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          mkdir _site
          cp -r web/. _site/
          sed -i "s/__BUILD__/${VERSION}/g" _site/sw.js
          echo "### Sidequest Version ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
